<script id="book-data" type="application/json">{"id":"rim-lore-a-v35","edition":"rim-lore-a-v35-original","title":"Кодекс Инженера","subtitle":"Записи Греги и Джонатана","entries":[{"id":"main.energy","kind":"main","title":"В пути","pages":["Джонатан\nНочуем под скальным навесом. Греги ещё вечером разложила образцы так, что к лежанкам надо пробираться боком. Утром я наступил на пустую коробку, она проснулась и первым делом спросила, целы ли пробирки.\nПосле завтрака проверили маленький генератор. Провода отсырели, стрелка дёргается. Подержал соединение над углями, стало лучше. Греги просит не считать это ремонтом. Обещал разобрать, когда найдём сухое место.\nДо обеда двинулись дальше. Всё наше имущество снова пришлось распределять между двумя сумками. Тяжёлые камни она незаметно переложила ко мне. Заметил только на подъёме."]},{"id":"main.workshop","kind":"main","title":"Лаборатория в стороне от дороги","pages":["Греги\nНашли здание за заросшим склоном. Часть крыши обвалилась, но две внутренние комнаты сухие. За дверью уцелел длинный рабочий стол. Джонатан сразу положил на него сумку, я попросила сначала проверить, держатся ли ножки.\nНикого нет. В шкафах инструменты, записи и пустые держатели для колб. Хочу остаться хотя бы на несколько дней. Здесь можно поставить прибор и не убирать его вечером ради костра.\nРазгребли одну комнату, во второй устроили место для сна. Джонатан починил плитку. Пока готовили крупу, обсуждали, откуда брать воду: ручей внизу, носить далеко. Завтра посмотрим, можно ли восстановить трубу."]},{"id":"main.guns","kind":"main","title":"Первый переход","pages":["Джонатан\nНесколько дней превратились в три недели. Из старых деталей собрали излучатель, открыли два портала в разных концах комнаты. Сквозь поверхность ничего не видно. Греги поставила у выхода пустую коробку и велела сначала отправить туда что-нибудь неживое.\nБросил обломок мела. Обошёл комнату, нашёл его в коробке. Потом протащили рейку и проверили, как меняется положение выхода. Для следующего опыта Греги приладила на тележку камеру: пусть первой едет она.\nИз нашей комнаты кладовой не сделаешь. Одну колбу уже опрокинули, пока пробирались к плите. Перенесли готовку за вторую дверь."]},{"id":"main.chemistry","kind":"main","title":"Колба на двоих","pages":["Греги\nПортальная смесь расслаивается, если спешить со вторым реагентом. Оставила медленное смешивание, а сама пошла за водой. Вернулась — Джонатан сидит у прибора и ест прямо над моими записями. Крупинки пришлось вычищать из разъёма.\nСохранили по образцу своей крови для проверки найденного анализатора. Подписи сделали полные, иначе он опять напишет инициалы, которые не разберёт сам. Пробирки убрала в работающий холодильный блок.\nНовую управляющую плату Джонатан закончит к вечеру. По прежней схеме мы уже открывали выход в соседнюю комнату; с этой хотим попробовать дальше. До запуска нужно проверить все соединения снизу."]},{"id":"main.circuits","kind":"main","title":"Ночное испытание","pages":["Греги\nНа плате в цепь стабилизации попал шумовой сигнал. Мы увидели ошибку слишком поздно. Портал открылся, его поверхность пошла вглубь, к ней потянуло бумагу и инструменты. Потом сдвинуло стол.\nЯ полезла к выключателю, но стол загородил проход. Потянуло меня, ноги уже не держали. Джонатан оттолкнул меня за стойку. Я схватилась за край, он остался перед проёмом.\n«НЕ ПРИБЛИЖАЙСЯ!» — это слышала отчётливо. Потом его затянуло. Портал закрылся сам, питание ещё работало.\nВключала снова. Каждый выход проверяла камерой на тележке: по непрозрачной поверхности ничего не узнать. На первой записи вода, на второй — каменная стенка. Джонатана не было. Я просмотрела записи несколько раз."]},{"id":"main.modules","kind":"main","title":"После аварии","pages":["Греги\nУбрала со стенда всё, что может сорваться. Прикрутила груз и воспроизвела втягивание за перегородкой. Портал снова закрылся сам. Повторный запуск ведёт уже в другое место.\nС платы сняла положения контактов. Одного разъёма не хватает, его унесло. По сохранившейся записи не получается восстановить ни прежний сигнал, ни выход.\nК вечеру кончилась вода. Сходила к ручью, вернулась уже в темноте. Всё время ждала, что услышу его из рабочей комнаты. Ужин так и остался на плитке. Убрала утром."]},{"id":"main.sabers","kind":"main","title":"Сорок один запуск","pages":["Греги\nЗа две недели проверила сорок один выход. Тележка возвращается по тросу, запись смотрю только после закрытия. У восьми мест видна земля, остальные для прохода не годятся. Ни одной вещи из нашей лаборатории, ни следов Джонатана.\nПульт перенесла за перегородку. Поймала себя на том, что подхожу к поверхности раньше, чем возвращаю камеру. Через портал можно пройти, но увидеть опасность заранее нельзя.\nКрупа кончилась. Проверяю ловушки у ручья и сушу рыбу, как делали в дороге. Один вечер потратила на крышу над холодильным блоком. После дождя вода пошла по стене. Все образцы пришлось перенести к себе в комнату."]},{"id":"main.implants","kind":"main","title":"Анализатор","pages":["Греги\nСлучайные выходы пока не запускаю. Разбираю прибор, для которого мы сохраняли кровь. В старых записях есть сравнение образца с живой тканью донора. Саму методику ещё не повторила, но один канал прибора остаётся чувствительным после того, как пробирку убирают с датчика.\nОставила свой образец, включила регистратор и несколько раз прошла по комнате. На записи изменения совпадают с моим движением. При выключенном силовом блоке видно лучше.\nНужно отделить помехи от реакции на меня. Ставлю прибор на таймер: рядом с ним никого не будет. Кнопку запуска протянула длинным проводом."]},{"id":"main.dna","kind":"main","title":"Своя кровь","pages":["Греги\nЗаписываю датчик, пока хожу по заранее отмеченным точкам. Камера снимает прибор, часы помогают потом совместить показания с маршрутом. Всё делаю сама, поэтому на каждую серию уходит полдня.\nПереставила питание. Ложный отклик у кабеля пропал. По моему образцу прибор теперь отличает движение в соседней комнате от пустой комнаты. На одной стене сигнал теряется; пока не понимаю почему.\nПробирка Джонатана цела. Достала её из холодильного блока и перепроверила подпись. Для этих опытов использую только свою. С его образцом другого шанса взять новый у меня нет."]},{"id":"main.capsule","kind":"main","title":"Два регистратора","pages":["Греги\nВ кладовой нашёлся второй регистратор. Его корпус проржавел, внутри плата сухая. С ним можно сравнивать два датчика одновременно, пока я нахожусь снаружи здания.\nПроверяла возле ручья. Первый канал удерживал направление, второй почти ничего не записал. По возвращении обнаружила трещину на креплении антенны. Завтра повторю, сегодня не успею до темноты.\nРаньше на такие проверки ходили вдвоём: один у прибора, другой снаружи. Теперь сначала прохожу маршрут сама, потом сижу над двумя записями. На обратном пути подняла ветку, которую он всё время задевал сумкой. Положила у двери, утром уберу."]},{"id":"main.antenna","kind":"main","title":"За пределами комнаты","pages":["Греги\nНовая антенна даёт ответ дальше стены. Отмечаю точки по дороге, каждый раз возвращаюсь проверить запись. У самой лаборатории уверенно, за склоном хуже. В одной серии датчик показывал на меня даже после того, как я ушла. Нашла зависание, переделала сброс.\nХочу связать поиск живого донора с выбором второго выхода. Повторять случайный сигнал аварии больше не нужно: если удастся удержать цель, можно будет открыться возле неё.\nС Джонатаном пока ни одного устойчивого ответа. Проверяю пробирку отдельно. По-прежнему читается."]},{"id":"main.phoenix","kind":"main","title":"С другой стороны стенда","pages":["Греги\nПушку закрепила в дальней комнате. У пульта таймер, у выхода — камера. Вставила свой отпечаток и ушла на испытательную площадку за зданием. Вход должен открыться возле пушки, второй портал — возле меня.\nНа первом запуске увидела край поверхности почти у земли. Отключила стенд по проводу. Во второй раз он появился выше, но близко к стене. Меня пока никуда не переносит: проверяю только положение и возвращаюсь к записи в комнате.\nОтпечаток после опытов не изменился. Переделала гнездо, чтобы не приходилось каждый раз трогать сам образец руками."]},{"id":"main.console","kind":"main","title":"Свободное место","pages":["Греги\nДатчик находит донора, но выход ещё приходится проверять отдельно. На площадке он встал возле кучи обломков. Ввела поиск свободного места и опоры под ногами. Если подходящего участка нет, второй портал не должен открываться.\nСама переставляю ящики, потом ухожу с пультом, запускаю и записываю результат. Уже несколько раз возвращалась за ключом, забытым с другой стороны стенда. К вечеру начала путать номера попыток и остановилась.\nДля первых проходов протянула страховку. Пока прохожу только между двумя площадками рядом с лабораторией. За склоном оставляю камеру и сначала возвращаю её запись."]},{"id":"main.coding","kind":"main","title":"В корпусе пушки","pages":["Греги\nСобрала поисковый узел в небольшом корпусе. Отпечаток вставляется отдельно, трогать провода перед запуском больше не приходится. Испытывала на себе, с другими настройками и с почти пустой колбой. Отказ теперь можно отличить от найденной цели.\nС безопасным выходом ещё работала два дня. Убрала возможность вручную пропустить проверку. Когда устаю, очень хочется решить, что один раз можно и так.\nМодуль помещается в пушку. Всё равно держу её на стойке. Если обнаружится Джонатан, второй рукой буду управлять отключением, а сначала отправлю камеру."]},{"id":"main.storage","kind":"main","title":"Один отклик","pages":["Греги\nПрошло больше девяти месяцев. Под прежними случайными выходами лежат уже другие записи. Сначала я всё оставляла как было в день аварии. Потом понадобилось место, пришлось разбирать столы.\nС отпечатком Джонатана появился один устойчивый отклик. До этого бывали короткие всплески, этот держится. Выключила питание, проверила колбу и соединения, повторила. Тот же результат.\nПодготовила камеру, свежий аккумулятор и аварийный выключатель на проводе. В комнате всё закреплено. Выйду только после записи и проверки опоры. Хочется сделать сразу, поэтому записываю порядок и буду идти по нему."]},{"id":"main.universes","kind":"main","title":"Голова с другой стороны","pages":["Греги\nКамера вернулась с записью мастерской. За столом сидит мужчина спиной к ней, левой рукой держит насос. Лицо не видно. Несколько раз остановила запись на одном месте. По тому, как он отодвигает инструмент локтем, очень похож на Джонатана.\nОткрыла снова, поставила страховку и просунула голову сквозь непрозрачную поверхность. Он продолжал работать. Позвала по имени.\nОбернулся и несколько секунд смотрел. Потом встал так резко, что стул отъехал к стене. Пока выбиралась целиком, он уже добежал. Обнял, смеялся, пытался что-то сказать и снова обнимал. Я только спрашивала, цел ли он.\nКамеру он заметил раньше, но принял за прибор покупателя. Портал за спиной его вообще не насторожил."]},{"id":"main.omega","kind":"main","title":"Снова в лаборатории","pages":["Греги\nВернулись в тот же день. Джонатан забрал коробку с листами и инструменты, хозяину мастерской оставил ключ. За оставшейся работой ещё придётся сходить. У нас он сразу пошёл проверить плитку: ручку я давно заменила, он этого не знал.\nПро левую руку спросила уже здесь. Думала, это наружная шина. Он снял рукав и показал, как киберрука с манипулятором соединяется с плечом. Потом стал объяснять про нейроинтерфейс, окулярную матрицу и установленный на позвоночнике «Сандевистан». До этого я о таких имплантах не знала. В Night World есть рипперы, которые их ставят; сам он ничего себе не вживлял.\nПопросила не демонстрировать ускорение рядом с нашими колбами. Он обиделся, но пушку отложил. Ночью сидели над его записями. Подробности про руку я всё время переспрашивала, хотя читать собиралась с первой страницы."]},{"id":"secret.biosphere","kind":"secret","world":"Биосфера","title":"Под большой шляпкой","pages":["Пришёл в себя на мокрой глине. Несколько минут пытался подняться, прежде чем понял, что лежу на собственной руке. Перед глазами до сих пор колышется поверхность портала. По ту сторону ничего не было видно ни до падения, ни когда меня затянуло.\nПозвал Греги. Сначала негромко, потом орал, пока не заболело горло. Вокруг грибы выше лаборатории, в которой мы остались жить. Самого здания, конечно, здесь нет. Искать его всё равно потащился, как только смог подняться.","В первые дни далеко не отходил. Казалось, Греги сейчас включит установку, и я должен стоять там, где упал. На ночь забирался под низкую шляпку; с края всё время капало, зато сверху не лило.\nВоду пил из ручья. Живот потом сводило так, что пришлось полдня лежать. Нашёл возле старой лаборатории металлическую ёмкость и стал кипятить. Развести огонь одной рукой получилось далеко не сразу.","В лаборатории никого нет. Дверь заросла, внизу под ней корни. В одном шкафу бумага ещё сухая. На ней и пишу. Инструменты проржавели, но нож отмыл.\nМелкий зверёк ест мягкие наросты у воды. Я сначала насобирал таких же, потом выбросил почти всё: они отличались снизу. Те, что совпали, пробовал понемногу. Уже неделю ем одно и то же. Наелся бы чего угодно другого.","Левая рука стала сгибаться лучше, пальцы всё ещё немеют. Разрезал рукав: ткань тянула за подсохшую кожу. Выглядит скверно. Укладываю руку выше, когда ложусь.\nВечером под грибом загораются пластинки. Первые ночи из-за них не спал. Теперь просыпаюсь, если свет закрывается: значит, рядом кто-то большой. Вчера прошёл зверь с корнями на спине. До утра сидел без огня.","Потерял счёт дням, когда промокли зарубки на тонкой дощечке. По оставшимся выходит больше месяца. Проверять место падения хожу теперь раз в несколько дней.\nСегодня перенёс туда камни, чтобы можно было увидеть сверху. Думал о Греги. Если выбралась из-за стойки, она там одна. Не представляю, как разобрать этот завал без меня. Ещё хуже — что она могла не удержаться. С той стороны я уже ничего не видел.","Из старой вентиляционной решётки сделал сушилку. Мягкие наросты после неё хранятся дольше, но вкус хуже. Отдал бы всё за обычную картошку. Соль особенно снится: во сне сыплю, сыплю, а она никак не попадает в тарелку.\nК месту падения на этой неделе не ходил. Переехал к лаборатории, там можно закрыть дверь. Под грибом оставил мокрые вещи. Вернусь, когда высохнут.","Утром услышал, как кто-то ругается. Подумал, опять приснилось. Потом из-за камней вышел мальчишка в жёлтой футболке. Я побежал к нему и споткнулся так, что он сам испугался.\nЗа ним появился старик в белом халате, с торчащими бледно-синими волосами. Парень сказал: «Рик, посмотри на его руку». Старик велел мне сесть. От его прибора кожу сильно защипало, зато онемение ненадолго прошло.","Объяснил им, что произошло. Рик попросил название мира. Назвал знакомые места и координаты найденной лаборатории. Он прервал: «Это место. Мир какой?» Ничего, что ему помогло бы, я ответить не смог.\nПарень начал спорить с ним, когда Рик собрался уходить. Я стоял рядом с собранной сумкой и старался не смотреть на них. Наконец Рик сказал, что высадит меня там, где есть люди. Заедет по своим делам, потом высадит. Я согласился сразу."]},{"id":"secret.storm_belt","kind":"secret","world":"Грозовой пояс","title":"Держаться ниже","pages":["Через портал вышли на узкий каменный мост. Под ним облака, в разрыве — пустота. Я вцепился в Рика за халат. Он выдернул ткань и показал, куда наступать.\nКаменные шпили торчат между островами. Над ними второй слой облаков, почти неподвижный. Пока я смотрел наверх, парень подхватил мою сумку: она уже сползала с края.","Рик шёл к башне за кристаллом. Сказал не трогать ничего, что похоже на часть основания. Я спросил почему. Он бросил в стену мелкий камень. Из-за шпиля поднялось широкое существо, и мы пригнулись.\n«Теперь понятно?» — спросил он. Парень выругался на него шёпотом. Я решил, что вопросов пока достаточно.","Коротконогие животные на площадке вдавились в землю ещё до вспышки. Одно зацепилось передними лапами за выступ. Я успел присесть рядом, когда ударило в шпиль.\nРик прикрыл свой прибор ладонью, посмотрел на показания и велел всем отойти от перил. Я стоял ближе остальных. Парень потянул меня за пояс, потому что левую руку я всё ещё плохо чувствовал.","На островной станции сухо, только крышу пробило в двух местах. Поел сухой еды из чужого пакета. Хотел отложить половину на потом. Парень заметил и протянул ещё.\nОн спросил, давно ли я один. Я ответил, что не знаю, примерно шесть недель. Он переспросил: «Здесь?» Пришлось объяснить про грибы. Рик из соседней комнаты крикнул, чтобы мы не переносили туда разговор: ему нужна тишина.","Пока ждали грозу, рассказал про Греги. До аварии дошёл и замолчал. Парень спросил, была ли она за стойкой, когда меня унесло. Я сказал, что видел её руки на краю.\n«Тогда, наверное, удержалась», — ответил он. Я и сам надеюсь. Только с той стороны уже не было видно пола, всё летело перед глазами. Ему больше ничего не рассказал.","Кристалл треснул у Рика в зажиме. Он выругался, а потом долго вычищал мелкие кусочки из прибора. Парень спросил, можно ли уже идти. Рик ответил, что можно было вообще не приходить, если бы кое-кто не сжёг прежний узел.\nНе понял, кто именно сжёг. Они оба одновременно начали объяснять другому, что случилось на самом деле. Я отошёл от стола.","У моста появилось летающее существо. Оно держалось выше, пока Рик не поднял блестящую деталь. Тогда резко пошло вниз.\nРик открыл портал у нас под боком, и парень толкнул меня первым. Сам едва не зацепился ногой за край. С другой стороны Рик отряхнул деталь, посмотрел на него и спросил, целы ли ноги. «Целы». — «Тогда не стой на сумке».","Записываю на белом камне, пока Рик разбирает добытое. Перестать бояться перехода пока не могу. Каждый раз кажется, что выход закроется раньше, чем я переступлю.\nПарень предложил идти со мной рядом. Отказался, потом перед следующим порталом всё-таки подождал его. Он сделал вид, что просто тоже не спешит. До сих пор толком не познакомились. Моё имя он прочёл на ремне сумки."]},{"id":"secret.isotope_wastes","kind":"secret","world":"Изотопные пустоши","title":"Белая пыль","pages":["Здесь белые уступы и ржавые полосы в обрывах. Поначалу обрадовался ровной земле. Через несколько шагов подошёл к трещине: дна из-за темноты не видно, противоположный край совсем рядом.\nРик перескочил первым. Я начал обходить, парень пошёл со мной. Он сказал, что тоже не хочет прыгать. При Рике, правда, объяснил это тем, что охраняет меня.","Возле карьера мелкие клешнястые существа собирались на нагретых плитах. Одно схватило свисающую лямку. Я дёрнул сумку, оно вцепилось сильнее.\nРик даже не остановился. Парень помог ослабить ремень, и мы оставили его на камне. Животное через минуту само разжалось. Кожа на лямке осталась, застёжку оно заметно согнуло.","В хранилище стоял керамический сторож. Рик осмотрел его со всех сторон и велел нам оставаться у двери. На этот раз я послушался сразу.\nОн что-то сделал под нижней пластиной. Сторож развернулся к нему. Рик отступил, продолжая смотреть в прибор. Парень уже держал меня за плечо. Забирать из комнаты свои вещи Рик потом ходил один.","Для своего устройства Рик искал материал на защитную прослойку. Показал ему серый кусок возле стены. Он спросил, зачем ему штукатурка. Убрал обратно.\nЧерез десять минут он взял похожий кусок из нижнего слоя. Я спросил, чем отличается. «Тем, что этот мне нужен». Парень фыркнул. Рик пояснил про структуру, быстро и раздражённо. Половину я не понял.","На белом грунте видно каждую каплю с моей руки. Повязка опять разошлась. Парень заметил раньше меня. Рик закатил глаза, выдал новый бинт и сказал больше не снимать фиксацию ради удобства.\nЯ снимал её, потому что не мог есть. Он молча переставил защёлку на другую сторону. Теперь можно расстегнуть пальцами правой руки. Поблагодарить не дал: уже ушёл к своему прибору.","Пока сидели у стены, парень спросил, кем я работал. Рассказал, как мы с Греги ходили с прибором и двумя сумками, ставили опыты, где находилось место. Про найденную лабораторию рассказал подробнее. Сам не заметил, что опять говорю «у нас».\nРик попросил не переходить к устройству портальной пушки. Я её ещё не упоминал. Оказывается, услышал слово «излучатель» и решил, что дальше будет долго. Парень сказал, что ему интересно. Объяснил коротко, без схем.","Земля возле выхода из карьера зашевелилась. Из щели вышло длинное существо. Я сперва принял его за кусок трубы и подошёл слишком близко.\nРик схватил меня за ворот, как ребёнка, и дёрнул назад. Задняя часть куртки треснула. Он выстрелил рядом с существом, потом заорал на нас обоих, хотя парень стоял сзади и вообще ничего не делал.","Пыль набилась в обувь. На остановке высыпал из каждого ботинка по маленькой горке. Снял носок — стопа белая, только полоска под резинкой нормального цвета.\nПарень долго тряс свой кроссовок, затем протянул мне бутылку. Я спросил, сколько осталось. Он посмотрел на Рика. Тот сказал, что воду найдём, и потребовал вернуть ему отвёртку. Она всё это время была у него за ухом."]},{"id":"secret.dark_zone","kind":"secret","world":"Тёмная зона","title":"Не светить в воду","pages":["Из пустошей попали под каменную арку над водой. Здесь видно синие растения и фиолетовые кристаллы, но на расстоянии нескольких шагов они сливаются с темнотой.\nЯ включил маленькую лампу. Рик тут же направил мою руку вниз. Над водой что-то повернулось к нам. Парень почти беззвучно спросил, долго ли нам здесь оставаться. Рик показал два пальца. Потом добавил третий.","Нужный ему материал лежал в старой шахте. К ней шёл узкий проход под скалой. Лампу Рик забрал, дал тусклую полоску на запястье. При ней можно видеть руки, стены уже нет.\nЯ снова потерял его из виду и остановился. Парень задел мой ботинок. Мы оба попытались извиниться шёпотом, стукнулись головами и замолчали.","У шахты я уронил пустую ёмкость. Она катилась под уклон ужасно долго. Из бокового прохода вышел крупный зверь. Морду я толком не рассмотрел.\nРик прижал меня к стене и закрыл мне рот ладонью, хотя я не собирался кричать. Зверь пошёл за ёмкостью. Когда скрежет затих, мы оставались на месте. Парень зажмурился и держал Рика за рукав.","В сухой нише Рик включил прибор. Тот сразу начал пищать. Парень схватил его за запястье. Рик отключил звук и сказал: «Да знаю я». Было видно, что не вспомнил.\nЯ невольно рассмеялся. Очень тихо. Он посмотрел так, что веселье прошло. Потом протянул мне прибор и велел держать ровно, пока он снимает пластину. Правой рукой держать неудобно, но справился.","Ждали, пока осядет взвесь после вскрытия пластины. Вокруг ничего не двигалось. Впервые за всё время с ними стало так тихо, что я услышал, как стучат собственные зубы.\nПарень спросил, замёрз ли я. Соврал, что да. Он предложил поменяться местами, потому что там сквозило. Я остался. Вспоминал последнюю секунду в мастерской и никак не мог перестать смотреть на тёмный проход.","На обратном пути Рик снял светящуюся полоску и бросил её далеко к воде. За ней двинулось то самое существо, которое заметили у арки. Мы вышли по другой стороне.\nПарень спросил, не пострадает ли от неё кто-то ещё. Рик ответил, что свет погаснет через минуту. Парень посмотрел на полоску, потом на прибор у него в руке. Тот показал отсчёт. Только после этого пошли.","У меня выпал лист из сумки. Рик уже открыл выход, но я вернулся за ним. Поднять с мокрого камня одной рукой не получалось. Парень подержал сумку.\nРик спросил, что там такого важного. На листе были мои подсчёты дней. Сказал, что записи. Он посмотрел и не стал дожидаться ответа подлиннее. Оставил портал открытым, пока мы оба не вышли.","Руки ещё дрожат. Сложил мокрый лист отдельно, иначе испорчу остальные. Парень сидит напротив, жуёт что-то и изредка смотрит в пустоту. Рик уже занят своим устройством.\nХочется попросить остановиться на ночь. Боюсь, что тогда меня здесь и оставят. Парень сам спросил про отдых. Рик сказал: ещё один переход, там можно сидеть сколько угодно. Вскоре оказалось, что сидеть лучше подальше от края."]},{"id":"secret.gravity_rift","kind":"secret","world":"Гравитационный разлом","title":"Ниже островов","pages":["Следующий выход был на траве. Я опустился прямо там. Сбоку воздух и кусок земли, висящий выше нас. Из его нижней части торчат длинные каменные зубья.\nПарень сел рядом. Рик отобрал у него пакет, вытащил последнюю еду и вернул половину. Они не договорились, кому сколько, просто оба стали есть. Мне парень оставил отдельный кусок.","Кольца из камня хорошо видны между островами. Одно оборвано, будто кто-то вынул половину дуги. Рик направился к нему, мы остались с сумками.\nСпросил парня, сколько ещё ехать. Он пожал плечами. Потом сказал, что Рик обычно называет меньше. Спросил, можно ли ему верить насчёт места с людьми. На этот раз он ответил сразу: «Я ему напомню».","Край под ногой был твёрдый, я просто неверно поставил ботинок. Соскользнул на нижний уступ. Успел развернуться в воздухе и думал, что сейчас ударюсь, но падал медленно.\nПарень сверху уже лёг на живот и тянулся ко мне. Протянул правую руку, он не достал. Рик вернулся, посмотрел вниз и выругался. Велел оставаться на уступе. Я никуда и не собирался.","Кинули мне трос. Камень с края упал вниз гораздо быстрее меня. Я подумал, что ошибся от страха, и спросил Рика. Он сказал, что камень не я, и чтобы я занялся узлом.\nУзел затянул зубами. Когда подняли, парень ещё долго не отпускал трос. Я тоже. Рик начал спорить с ним о том, кто должен был следить за краем. Мне никто ничего не сказал, от этого было особенно стыдно.","Дальше шли к сломанному доку по широкой части острова. На тропе стоял тяжёлый зверь. Рик обошёл его молча, чего я от него не ожидал.\nПарень попробовал обойти с другой стороны. Зверь повернул голову, он тут же вернулся за нами. Рик не стал смеяться. Сам на всякий случай держал руку у кармана.","В доке валяются детали, слишком тяжёлые для своих размеров. Рик поднял небольшую двумя пальцами, взвесил прибором и поставил на основание. Я попытался сдвинуть соседнюю. Даже не шевельнулась.\nЕму зачем-то понадобилось знать, как я упал. Показал место. Он проверил границу и вернулся довольный. Парень потребовал, чтобы следующее испытание проводили без меня. Рик ответил, что я уже всё сделал.","Мне стало злиться на него проще, чем просить. Спросил прямо, почему он не может отвезти меня домой. Рик сказал, что найти мой мир можно попробовать, если у нас есть годы на перебор и он вдруг решит их потратить.\nПарень начал было возражать. Я попросил его не надо. Рик знает, что мы оба слышали ответ. Дальше упрашивать его при мальчишке я не хочу.","Через некоторое время Рик молча дал мне ту же штуку, которой смотрел руку. Показал, куда прижать. Сказал, что ещё один раз не вылечит, но к вечеру меньше будет ныть.\nПрижал. Боль действительно отступила. Он посмотрел на показания и велел не снимать фиксацию. Потом пошёл будить парня: тот задремал, положив голову на сумку. Проснулся мгновенно, ещё до того, как Рик коснулся плеча."]},{"id":"secret.stellar_frontier","kind":"secret","world":"Звёздная граница","title":"На верхнем уступе","pages":["Над камнями огромное солнце. После Тёмной зоны неприятно открывать глаза. Под уступом светлые кристаллы, дальше чёрная порода и огненная трещина.\nРик сунул каждому по тёмному стеклу на лицо. Парень спросил, почему нельзя выйти сразу возле нужного места. Оказалось, Рик ещё выбирает нужное место. Стояли и ждали, пока он смотрел вниз.","По светлому полю пробежали маленькие животные. Лап почти не видно, только короткие вспышки на боках. Одно остановилось возле нашей тени, потом скрылось за камнем.\nПарень полез за телефоном. Рик велел не снимать, пока они там. «Что, нельзя?» — «Можно. Потом будешь показывать всем, как они ушли». Пока спорили, ушло и последнее.","Попробовал спуститься к расщелине. Чем ниже, тем сильнее печёт открытое лицо. На защищённом уступе было терпимо; здесь пришлось сразу повернуть.\nРик увидел, дал плотную защиту и застегнул мне ворот правой рукой. Ругался, что приходится объяснять одно и то же. Про жар внизу он до этого ничего не объяснял. Парень сказал ему об этом раньше, чем успел я.","Остались под каменным навесом, Рик пошёл к коллектору. Парень сел спиной к стене и снял защиту с лица, чтобы попить. На лбу красная полоса от края стекла.\nСпросил, как он это выдерживает. «Сегодня ещё нормально». Потом помолчал и добавил: «Только ты так не думай. Не нормально. Просто бывало хуже». Мы оба посмотрели туда, где скрылся Рик.","На пути к обсерватории за нами увязалось серое существо. Парень заметил его по осыпающимся камням. Мы ускорились, оно тоже.\nУ двери он закричал Рику. Тот выглянул, поднял прибор и прогнал зверя вспышкой. Сначала схватил парня за плечи, повернул к свету, осмотрел. Только потом спросил меня, не задело ли. Никого не задело. Отдышаться всё равно долго не могли.","Внутри обсерватории стекло почти не пропускает жар. Снаружи пластины кажутся цельными, изнутри видно, сколько там стыков. Рик искал тонкую линзу и забирал только небольшие целые части.\nПредложил подержать рамку. Он посмотрел на левую руку и велел держать сумку. Вместо меня рамку взял парень. По его лицу было видно, что он предпочёл бы сумку.","Рик собрал устройство на полу. Пока оно разогревалось, мы сидели на ящиках. Я спросил, что это за деталь. Новый блок питания для его корабля. Старый он вынул из кармана халата и положил рядом. С виду отличаются только размером; что внутри, я уже не спрашивал.\nОт устройства шёл тонкий звук, и мелкая пыль собралась на одной стороне корпуса. Рик остался доволен. Потом снова раскрутил крышку: звук ему не понравился.","Солнце не ушло из поля зрения за всё время, что мы здесь. По моим ощущениям, давно пора спать. Парень заснул бы стоя, если бы мы ещё остановились.\nРик наконец убрал устройство. Я попросил воды. Он протянул бутылку и сказал, что следующая остановка уже город. Парень поднял голову: «Настоящий?» Рик поморщился. Тогда я ещё не понял, почему он переспросил."]},{"id":"secret.fake_ideal_world","kind":"secret","world":"Фейковый идеальный мир","title":"Никого в окнах","pages":["Город виден сразу. Огромные башни, ровная дорога, стекло, подсвеченные полосы. Я даже ускорил шаг. Всё ждал, что за поворотом начнут ходить люди.\nДошли до площади. Ветер гонял по ней только пыль. Парень окликнул кого-то в тёмном проёме. Там никого не оказалось, просто отражался край соседней башни.","Внутри первого здания пусто. Не разграбленная комната, а огромный полый объём. Вдоль стен нет ни лестниц, ни дверей. Поднял голову и не увидел потолка.\nИз следующего здания вышел с тем же результатом. Рик в это время спокойно проверял прибор на улице. Спросил его, где здесь живут. Он сказал, что пока никто. Слово «пока» он добавил, глядя на меня.","Я прошёл ещё несколько кварталов. Бессмысленно, но не мог сразу остановиться. Похожее на вывеску оказалось такой же световой полосой, как везде. Под ней голая стена.\nПарень догнал у перекрёстка. Он тоже заглядывал в окна. Спросил, нашёл ли что-нибудь. Покачал головой. Пошли обратно вместе, медленно: ноги после переходов уже плохо слушались.","За крайними башнями вода. От неё город отделяет высокая стена. В тумане трудно понять, насколько далеко тянется берег.\nСел возле стены и снял сумку. Только сейчас начал дрожать. Несколько часов назад был уверен, что выбрался, как только увидел город. Была мысль просто сидеть здесь, пока они уйдут. Парень не уходил. Присел на некотором расстоянии и ничего не спрашивал.","Рик сказал, что здесь сухо, есть где спать и никто не станет мешать. Парень спросил, что я буду есть. Рик начал доставать из кармана какие-то пакеты.\n«А когда кончатся?» — спросил парень. Рик ответил, что у него и так ушло полдня, и велел перестать разговаривать с ним таким тоном. Они отошли. Я всё слышал, хотя сделал вид, что разглядываю воду.","Решили ехать дальше. Рик вернулся злой и сказал, что потом каждый занимается собой. Я сказал спасибо. Он даже не посмотрел.\nПарень помог мне снова застегнуть сумку. Я спросил, зачем он столько возится со мной. Он пожал плечами и сказал, что я тут умру. Сказал просто, без жалости. Я не нашёл, что ответить, и занялся ремнём.","Пока Рик что-то калибровал, я дошёл до середины улицы. В стекле можно увидеть себя целиком. Худой, грязная одежда, рука притянута к груди. Волосы торчат почти как у Рика, только без цвета.\nПопытался пригладить. Парень увидел отражение и тоже поправил волосы. Получилось ещё хуже. Засмеялись оба. Рик крикнул, чтобы мы уже шли.","Оставил под навесом обрывок нашей упаковки, прижал камнем. Написал, что здесь никого не нашли и воды для питья не проверяли. Вдруг кто-то ещё попадёт.\nРик заметил. Сказал, что чужая бумажка не заменит человеку голову. Я ответил, что это всё равно лучше, чем никакой бумажки. Парень улыбнулся. Сам я, наверное, на месте такого человека решил бы, что здесь поблизости наконец кто-то живёт."]},{"id":"secret.night_world","kind":"secret","world":"Ночной мир","title":"За стеной","pages":["Вышли возле настоящего прилавка. За ним сидел человек, ел и считал мелкие пластинки. Услышав нас, недовольно отодвинул еду. Я смотрел на него слишком долго; он спросил, чего надо.\nРик продал ему несколько деталей, получил местные деньги и рассчитался за воду. Я спросил про работу. Торговец показал на сломанный насос возле стены. Рик не стал ждать, пока я его осмотрю.","У самого выхода парень вложил мне в ладонь несколько монет из тех, что дал ему Рик. Я попытался вернуть. Он закрыл мою ладонь.\n«Меня Морти зовут», — сказал он. Я ответил, что Джонатан. Он улыбнулся: «Это я знаю».\nРик уже стоял у открытого портала. Морти махнул мне рукой и побежал за ним. Хотел ещё что-то сказать, но проём закрылся. В руке остались деньги. Сел возле насоса и долго смотрел туда, где они только что были.","За насос заплатили. Хозяин прилавка дал ещё два, потом предложил место за перегородкой. Можно спать и держать инструменты, если чиню его вещи первым.\nОднажды отправил меня к рипперу показать руку. Я решил, что это местное слово для лекаря. В приёмной сидел человек с металлическими пальцами. Я всё смотрел, как он застёгивает ремень. Когда поймал мой взгляд, спросил, что я потерял. Сказал, что, похоже, нормальную левую руку. Он подвинулся, дал сесть.","Риппер показал повреждение и несколько вариантов замены. На самый дешёвый не хватало. Почти два месяца откладывал, брал работу у соседних торговцев. Потом поставили нейроинтерфейс и левую киберруку с манипулятором.\nТрёхпалый захват достаёт дальше моей прежней руки. Первую неделю от этого было больше неприятностей: цеплял вещи на столе, забывая, где теперь кончаются пальцы. Теперь удобно доставать детали из глубины корпуса. На ночь ставлю аккумулятор на зарядку, иначе утром вся эта польза не работает.","Позже поставил окулярную матрицу. Ночное зрение здесь нужно постоянно: под столом и за оборудованием свет от вывесок не помогает. Мелкие дорожки всё равно смотрю через обычное увеличительное стекло. Риппер сразу сказал, что вместо него матрица не будет.\nЗа стену выхожу, когда от шума начинает болеть голова. Там луга и лес. О Греги почти ни с кем не говорю: её здесь никто не знал. Иногда думаю, что она снова в дороге. Мы и до лаборатории никогда подолгу на одном месте не жили.","Хозяин предложил отдельную комнату и ещё работу. Переехал. Через несколько месяцев смог заплатить за «Сандевистан». Его ставят на позвоночник, подключают к нейроинтерфейсу. Риппер учил включать коротко и следить за зарядом.\nПервый раз попробовал возле пустого стола. Стало трудно соразмерять движения: я уже тянулся к другой вещи, а рука ещё заканчивала прежнее. Теперь иногда пользуюсь при ремонте, когда нужно успеть удержать соскальзывающий узел. Для всей смены не годится, и отдыхать между включениями всё равно приходится.\nКоробку с записями храню под кроватью. Домой уже не рассчитываю.","За спиной открылся портал. У нас бывает, что сначала присылают камеру, а потом приходят с деталью. Увидел на столе чужую тележку, отодвинул, чтобы не поставить на неё насос. Она уехала обратно. Через некоторое время портал открылся снова. Продолжил откручивать гайку.\nПотом меня позвали по имени.\nОбернулся. Из непрозрачной поверхности выглядывала голова Греги. Несколько секунд сидел и смотрел. Потом вскочил. Она ещё не успела выйти целиком, когда я добежал. Я смеялся, обнимал её и всё время трогал за плечи. Сказать нормально почти ничего не получилось.","В лабораторию вернулись в тот же день. Греги долго смотрела на мою левую руку, пока я разбирал сумку. Оказалось, приняла её за съёмное приспособление. Пришлось сесть и рассказать сначала про риппера, потом про остальные импланты.\nОна ничего о них не слышала. Полезла за тетрадью, стала спрашивать, что соединено с нервами и где питание. Рассказал всё, что понял у риппера. Насчёт остального пообещал сводить к нему, когда заберём мои вещи.\nНочью почти не спал. Греги рассказывала про поиски и засыпала посреди фразы. Несколько раз будил её глупыми вопросами, лишь бы услышать ответ. Потом она рассердилась и велела лечь. Долго ещё держал её за руку."]}],"sourceVersion":"4.1.0","sourceDigest":"1599cb82bc868c36999f87047fb6347fd79241c83a8bcd6fd0ba1915e5ecd2c8"}</script>
<script>
'use strict';
const data=JSON.parse(document.getElementById('book-data').textContent);
const $=id=>document.getElementById(id), units=[],byKey=new Map();
data.entries.forEach((entry,entryIndex)=>entry.pages.forEach((raw,folio)=>{
 const first=raw.split('\n')[0],author=entry.kind==='main'&&['Греги','Джонатан'].includes(first)?first:'';
 const unit={key:entry.id+':'+folio,entry,entryIndex,folio,raw,author,text:author?raw.slice(author.length+1):raw};units.push(unit);byKey.set(unit.key,unit);
}));
const storageKey='rim-reading-'+data.edition;
let stored={};try{stored=JSON.parse(localStorage.getItem(storageKey)||'{}')}catch{}
let fontSize=Math.min(24,Math.max(16,Number(stored.font)||18)),theme=stored.theme==='night'?'night':'paper',bookmarks=Array.isArray(stored.bookmarks)?stored.bookmarks.filter(a=>a&&byKey.has(a.key)&&Number.isFinite(a.offset)):[];
let pages=[],at=0,activePage=0,single=false,filter='all',query='',coverTab='main',resizeTimer,turnTimer,ready=false;
const normalize=s=>s.toLocaleLowerCase('ru').replace(/ё/g,'е');
const E=(tag,cls,text)=>{const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n};
function textInto(node,text){
 node.replaceChildren();if(!query){node.textContent=text;return}
 const needle=normalize(query),hay=normalize(text);let p=0,i;
 while((i=hay.indexOf(needle,p))>=0){node.append(document.createTextNode(text.slice(p,i)),E('mark','',text.slice(i,i+query.length)));p=i+query.length;if(!needle.length)break}
 node.append(document.createTextNode(text.slice(p)));
}
function anchor(){const p=pages[activePage];if(p?.type==='story')return{key:p.unit.key,offset:p.start};const other=pages[at]?.type==='story'?pages[at]:!single?pages[at+1]:null;return other?.type==='story'?{key:other.unit.key,offset:other.start}:null}
function persist(){try{localStorage.setItem(storageKey,JSON.stringify({font:fontSize,theme,bookmarks,anchor:anchor(),front:at<2?at:null,end:pages[at]?.type==='end'}))}catch{}}
function meta(unit){return unit.entry.kind==='main'?'Хроника · '+String(unit.entryIndex+1).padStart(2,'0'):unit.entry.world+' · лист '+(unit.folio+1)+' из 8'}
function buildStory(sheet,leaf,index,measuring=false){
 const u=leaf.unit,entry=u.entry;sheet.replaceChildren();sheet.classList.toggle('secret',entry.kind==='secret');sheet.classList.toggle('continuation',leaf.start>0);
 const running=E('div','running');running.append(E('span','',entry.kind==='main'?'Личная хроника':'Тайные записи'),E('span','',entry.kind==='main'?'Греги · Джонатан':entry.world));sheet.append(running);
 sheet.append(E('div','chapter-no',entry.kind==='main'?'Глава '+String(u.entryIndex+1).padStart(2,'0'):'Лист '+(u.folio+1)+' / 8'));
 const title=E('h2','story-title');if(measuring)title.textContent=entry.title;else textInto(title,entry.title);sheet.append(title);
 if(u.author&&leaf.start===0)sheet.append(E('div','byline',u.author));
 const body=E('div','story-text');for(const part of leaf.text.split('\n'))if(part.trim()){const p=E('p');if(measuring)p.textContent=part;else textInto(p,part);body.append(p)}sheet.append(body);
 const footer=E('div','folio');footer.append(E('span','',leaf.start>0?'Продолжение':entry.kind==='secret'?'Из тайной тетради':'Кодекс Инженера'),E('span','page-number',String(index+1)));sheet.append(footer,E('div','ribbon'));
 if(!measuring){sheet.dataset.page=index;sheet.classList.toggle('marked',bookmarks.some(a=>a.key===u.key));}
 return body;
}
function fit(unit,start,end){const body=buildStory($('probe'),{unit,start,text:unit.text.slice(start,end)},0,true);return body.scrollHeight<=body.clientHeight+.5}
function paginate(){
 single=matchMedia('(max-width:800px)').matches;const h=Math.max(single?500:520,Math.min(single?760:740,innerHeight-(single?180:200)));
 document.documentElement.style.setProperty('--page-h',h+'px');document.documentElement.style.setProperty('--text-size',fontSize+'px');
 const width=$('left-sheet').getBoundingClientRect().width;$('probe').style.width=width+'px';
 pages=[{type:'cover'},{type:'contents'}];
 for(const unit of units){let start=0;if(!unit.text.length){pages.push({type:'story',unit,start:0,text:''});continue}
  while(start<unit.text.length){let end=unit.text.length;
   if(!fit(unit,start,end)){let low=start,high=end;while(low<high){const mid=Math.ceil((low+high)/2);if(fit(unit,start,mid))low=mid;else high=mid-1}end=low;
    if(end<=start)end=Math.min(start+1,unit.text.length);
    if(end<unit.text.length){let boundary=end;while(boundary>start&&!/\s/.test(unit.text[boundary-1]))boundary--;if(boundary>start+(end-start)*.5)end=boundary;}
   }
   pages.push({type:'story',unit,start,end,text:unit.text.slice(start,end)});start=end;
  }
 }
 pages.push({type:'end'});if(pages.length%2)pages.push({type:'end',blank:true});
}
function pageFor(a){if(!a||!byKey.has(a.key))return 0;let answer=pages.findIndex(p=>p.unit?.key===a.key);for(let i=answer;i<pages.length&&pages[i].unit?.key===a.key;i++)if(pages[i].start<=a.offset)answer=i;return Math.max(0,answer)}
function firstPage(entry){return pages.findIndex(p=>p.unit?.entry===entry)}
function cover(sheet){
 sheet.classList.add('cover');sheet.append(E('div','running','RiM / Личный архив'));
 const center=E('div','title-composition');center.append(E('div','cover-label','Собранные записи'));const title=E('h1');title.append(document.createTextNode('Кодекс'),E('br'),document.createTextNode('Инженера'));center.append(title,E('div','authors','Греги и Джонатан'));
 const seal=E('div','seal');seal.innerHTML='<svg viewBox="0 0 220 185" width="100%" height="100%" fill="none" stroke="currentColor"><path d="M20 150h180M35 156v7m150-7v7M20 144v12m180-12v12" opacity=".3"/><ellipse cx="88" cy="88" rx="42" ry="60" stroke-width="1.4"/><ellipse cx="88" cy="88" rx="34" ry="52" stroke-width=".6"/><ellipse cx="136" cy="94" rx="32" ry="46" stroke-width="1.2" stroke-dasharray="3 4"/><path d="M46 88h84M88 25v126m-8-118 8-8 8 8M38 46l28 16m62 59 30 17" stroke-width=".6" opacity=".45"/><circle cx="88" cy="88" r="4"/><path d="m159 43 13-13m-2 12 9-9M29 117l11-5m110 44 8 7" opacity=".5"/></svg>';
 center.append(seal,E('div','cover-count','17 глав хроники\n8 тайных тетрадей · 64 листа'));center.lastChild.style.whiteSpace='pre-line';sheet.append(center);const footer=E('div','folio');footer.append(E('span','','Полное собрание'),E('span','page-number','i'));sheet.append(footer);
}
function contentsPage(sheet){
 sheet.classList.add('contents');sheet.append(E('div','running','Кодекс Инженера'),E('h2','toc-title','Оглавление'));
 const tabs=E('div','tab-row');for(const[k,label]of[['main','Хроника · 17'],['secret','Тайные записи · 8']]){const b=E('button','tab'+(coverTab===k?' active':''),label);b.onclick=()=>{coverTab=k;render()};tabs.append(b)}sheet.append(tabs);
 const list=E('div','cover-list');let n=0;for(const entry of data.entries.filter(e=>e.kind===coverTab)){const b=E('button','toc-row');b.append(E('span','ordinal',String(++n).padStart(2,'0')),E('span','',entry.title),E('span','dots'),E('span','number',String(firstPage(entry)+1)));b.onclick=()=>go(firstPage(entry));list.append(b);if(entry.world)list.append(E('div','toc-world',entry.world))}sheet.append(list);
 const footer=E('div','folio');footer.append(E('span','','Полное собрание'),E('span','page-number','ii'));sheet.append(footer);
}
function endPage(sheet,p){sheet.classList.add('end');const c=E('div','title-composition');if(!p.blank)c.append(E('div','end-mark','RiM'),E('h2','','Конец записей'),E('div','cover-label','Греги и Джонатан'));sheet.append(c)}
function fill(sheet,p,index){sheet.className='sheet '+(sheet.id==='left-sheet'?'left':'right second');sheet.removeAttribute('data-page');sheet.replaceChildren();if(!p)return;if(p.type==='story')buildStory(sheet,p,index);else if(p.type==='cover')cover(sheet);else if(p.type==='contents')contentsPage(sheet);else endPage(sheet,p)}
function updateBookmark(){const a=anchor(),marked=a&&bookmarks.some(b=>b.key===a.key);$('bookmark-button').disabled=!a;$('bookmark-button').setAttribute('aria-pressed',String(!!marked));$('bookmark-button').title=marked?'Убрать закладку':'Добавить закладку';$('bookmark-button').setAttribute('aria-label',$('bookmark-button').title)}
function render(){
 const step=single?1:2;at=Math.max(0,Math.min(at,pages.length-step));at=Math.floor(at/step)*step;
 fill($('left-sheet'),pages[at],at);fill($('right-sheet'),pages[at+1],at+1);
 $('previous').disabled=at===0;$('next').disabled=at+step>=pages.length;
 $('progress').max=pages.length-step;$('progress').step=step;$('progress').value=at;
 $('progress-label').textContent=at<2?(at===0?'Начало книги':'Содержание'):'Страниц'+(single?'а ':'ы ')+(at+1)+(single?'':'–'+(at+2))+' / '+pages.length;
 $('progress').setAttribute('aria-valuetext',$('progress-label').textContent);
 const p=pages[activePage]?.type==='story'?pages[activePage]:pages[at];$('chapter-caption').textContent=p?.unit?p.unit.entry.title:p?.type==='end'?'Конец записей':'Греги и Джонатан';updateBookmark();
}
function go(index,animate=true){activePage=Math.max(0,Math.min(index,pages.length-1));at=single?activePage:Math.floor(activePage/2)*2;render();persist();if(animate&&!matchMedia('(prefers-reduced-motion:reduce)').matches){clearTimeout(turnTimer);$('book').classList.add('turning');turnTimer=setTimeout(()=>$('book').classList.remove('turning'),145)}}
function reflow(){const a=anchor(),front=at<2?at:null,end=pages[at]?.type==='end';paginate();go(front!==null?front:end?pages.length-1:pageFor(a),false)}
function openContents(){renderResults();$('contents-dialog').showModal();$('search').focus()}
function renderResults(){
 const results=$('results');results.replaceChildren();let found=0,lastGroup='';const needle=normalize(query);
 if(filter==='bookmarks'){
  for(const a of bookmarks){const u=byKey.get(a.key);if(!u||needle&&!normalize(u.raw+' '+u.entry.title+' '+(u.entry.world||'')).includes(needle))continue;appendResult(u,a.offset,false)}
 }else if(!query){for(const e of data.entries){if(filter!=='all'&&e.kind!==filter)continue;appendResult(units.find(u=>u.entry===e),0,false)}}
 else for(const u of units){if(filter!=='all'&&u.entry.kind!==filter)continue;if(normalize(u.raw+' '+u.entry.title+' '+(u.entry.world||'')).includes(needle))appendResult(u,0,true)}
 if(!found)results.append(E('div','empty',filter==='bookmarks'?'Нет закладок':'Ничего не найдено'));
 function appendResult(u,offset,snippet){const group=u.entry.kind==='main'?'Личная хроника':'Тайные записи';if(group!==lastGroup){results.append(E('div','result-group',group));lastGroup=group}
  const b=E('button','result'),title=E('div','result-title');textInto(title,u.entry.title);b.append(title,E('div','result-meta',meta(u)));
  if(snippet){const pos=normalize(u.raw).indexOf(needle),start=Math.max(0,pos-40),end=Math.min(u.raw.length,Math.max(pos,0)+120);const excerpt=E('div','result-snippet');textInto(excerpt,(start?'…':'')+u.raw.slice(start,end)+(end<u.raw.length?'…':''));b.append(excerpt)}
  b.onclick=()=>{const match=needle?normalize(u.text).indexOf(needle):-1;go(pageFor({key:u.key,offset:Math.max(offset,match)}));$('contents-dialog').close()};results.append(b);found++;
 }
}
function printBook(){const root=$('print-document');root.replaceChildren();const cover=E('article');cover.append(E('h1','',data.title),E('p','','Записи Греги и Джонатана'));root.append(cover);for(const entry of data.entries)entry.pages.forEach((text,i)=>{const article=E('article');article.append(E('div','print-meta',entry.kind==='main'?'Личная хроника':entry.world+' · лист '+(i+1)+' из 8'),E('h2','',entry.title));for(const paragraph of text.split('\n'))article.append(E('p','',paragraph));root.append(article)})}
$('previous').onclick=()=>go(at-(single?1:2));$('next').onclick=()=>go(at+(single?1:2));$('progress').addEventListener('input',()=>go(Number($('progress').value),false));
$('contents-button').onclick=openContents;$('type-button').onclick=()=>$('type-dialog').showModal();
for(const b of document.querySelectorAll('[data-close]'))b.onclick=()=>$(b.dataset.close).close();
for(const dialog of document.querySelectorAll('dialog'))dialog.addEventListener('click',e=>{if(e.target===dialog){const r=dialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)dialog.close()}});
$('search').addEventListener('input',()=>{query=$('search').value.trim();renderResults();render()});
for(const button of $('filter-tabs').children)button.onclick=()=>{filter=button.dataset.filter;for(const b of $('filter-tabs').children)b.classList.toggle('active',b===button);renderResults()};
$('font-size').value=fontSize;$('font-value').textContent=fontSize+' px';$('font-size').oninput=()=>{fontSize=Number($('font-size').value);$('font-value').textContent=fontSize+' px';reflow()};
function setTheme(){document.body.dataset.theme=theme;document.documentElement.style.colorScheme=theme==='night'?'dark':'light';$('theme-button').setAttribute('aria-pressed',String(theme==='night'));$('theme-button').title=theme==='night'?'Светлая бумага':'Ночной режим';$('theme-button').setAttribute('aria-label',$('theme-button').title)}
$('theme-button').onclick=()=>{theme=theme==='night'?'paper':'night';setTheme();persist()};setTheme();
$('bookmark-button').onclick=()=>{const a=anchor();if(!a)return;const index=bookmarks.findIndex(b=>b.key===a.key);if(index>=0)bookmarks.splice(index,1);else bookmarks.push(a);render();persist()};
for(const sheet of[$('left-sheet'),$('right-sheet')])sheet.addEventListener('click',e=>{if(e.target.closest('button'))return;if(sheet.dataset.page){activePage=Number(sheet.dataset.page);updateBookmark();persist()}});
$('print-button').onclick=()=>{$('type-dialog').close();printBook();window.print()};window.addEventListener('beforeprint',printBook);
document.addEventListener('keydown',event=>{if(document.querySelector('dialog[open]')||/INPUT|TEXTAREA|SELECT/.test(event.target.tagName))return;if(['ArrowRight','PageDown','ArrowLeft','PageUp','Home','End'].includes(event.key)){event.preventDefault();if(event.key==='Home')go(0);else if(event.key==='End')go(pages.length-1);else go(at+(['ArrowRight','PageDown'].includes(event.key)?1:-1)*(single?1:2))}});
let touch=null;$('book').addEventListener('touchstart',e=>{if(e.touches.length===1)touch={x:e.touches[0].clientX,y:e.touches[0].clientY}},{passive:true});$('book').addEventListener('touchend',e=>{if(!touch)return;const p=e.changedTouches[0],dx=p.clientX-touch.x,dy=p.clientY-touch.y;if(Math.abs(dx)>65&&Math.abs(dx)>Math.abs(dy)*1.5)go(at+(dx<0?1:-1)*(single?1:2));touch=null},{passive:true});
window.addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(()=>{if(ready)reflow()},150)});
document.fonts.ready.then(()=>{paginate();const target=stored.front!==null&&Number.isFinite(stored.front)?stored.front:stored.end?pages.length-1:pageFor(stored.anchor);go(target,false);ready=true});
window.RiMBook={get ready(){return ready},get pages(){return pages},get units(){return units},get position(){return at},get font(){return fontSize},get bookmarks(){return bookmarks},go,pageFor,reflow,data};
</script>
</body>
</html>
